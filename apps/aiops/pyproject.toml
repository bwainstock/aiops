[project]
name = "aiops-core"
version = "0.1.0"
description = "AIOps intake, workflow, agents, and approval application"
requires-python = ">=3.11"
dependencies = [
    "aiops-shared",
    "fastapi>=0.115,<1",
    "github-copilot-sdk>=0",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
aiops-copilot-smoke = "aiops_core.copilot_smoke:main"
aiops-triage = "aiops_core.triage_cli:main"
aiops-worker = "aiops_core.workflow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_core"]

[tool.uv.sources]
aiops-shared = { workspace = true }
