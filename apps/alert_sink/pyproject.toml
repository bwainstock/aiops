[project]
name = "aiops-alert-sink"
version = "0.1.0"
description = "Queryable Alertmanager webhook capture sink"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_alert_sink"]
