[project]
name = "aiops-demo-api"
version = "0.1.0"
description = "Deterministic demo HTTP workload"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.23,<1",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_demo_api"]
