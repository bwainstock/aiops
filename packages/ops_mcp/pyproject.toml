[project]
name = "aiops-ops-mcp"
version = "0.1.0"
description = "Bounded read-only operational MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2,<3",
]

[project.scripts]
aiops-ops-mcp = "aiops_ops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_ops_mcp"]
