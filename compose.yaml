name: aiops-lab

services:
  demo-api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    environment:
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: demo-api
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2);
          payload = json.load(response);
          assert response.status == 200 and payload["status"] == "ok"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
      - telemetry
    restart: unless-stopped

  loadgen:
    profiles:
      - load
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        WORKSPACE_PACKAGE: aiops-loadgen
        PACKAGE_PATH: apps/loadgen
    command:
      - aiops-loadgen
      - --base-url
      - http://demo-api:8000
      - --requests
      - "100"
    depends_on:
      demo-api:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  alert-sink:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        WORKSPACE_PACKAGE: aiops-alert-sink
        PACKAGE_PATH: apps/alert_sink
    command:
      - uvicorn
      - aiops_alert_sink.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --no-server-header
      - --no-access-log
    ports:
      - "127.0.0.1:${ALERT_SINK_PORT:-8090}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2);
          payload = json.load(response);
          assert response.status == 200 and payload["status"] == "ok"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - control
    restart: unless-stopped

  aiops-init:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - chown 10001:10001 /data
    user: "0"
    network_mode: none
    volumes:
      - aiops-data:/data

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      aiops-api:
        condition: service_healthy
    networks:
      - control
      - telemetry
    restart: unless-stopped

  aiops-api:
    image: aiops-lab-aiops:local
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        WORKSPACE_PACKAGE: aiops-core
        PACKAGE_PATH: apps/aiops
    command:
      - uvicorn
      - aiops_core.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --workers
      - "1"
      - --no-server-header
      - --no-access-log
    environment:
      AIOPS_DATABASE_PATH: /data/aiops.db
      AIOPS_JOB_LEASE_SECONDS: "5"
      AIOPS_JOB_MAX_ATTEMPTS: "3"
      AIOPS_WORKER_POLL_SECONDS: "0.5"
    ports:
      - "127.0.0.1:${AIOPS_API_PORT:-8081}:8081"
    volumes:
      - aiops-data:/data
    depends_on:
      aiops-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8081/healthz", timeout=2);
          payload = json.load(response);
          assert response.status == 200 and payload["status"] == "ok"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - control
    restart: unless-stopped

  aiops-worker:
    image: aiops-lab-aiops:local
    command:
      - aiops-worker
    environment:
      AIOPS_DATABASE_PATH: /data/aiops.db
      AIOPS_JOB_LEASE_SECONDS: "5"
      AIOPS_JOB_MAX_ATTEMPTS: "3"
      AIOPS_WORKER_POLL_SECONDS: "0.5"
      AIOPS_WORKER_PROCESSING_DELAY_SECONDS: "3"
    volumes:
      - aiops-data:/data
    depends_on:
      aiops-api:
        condition: service_healthy
    networks:
      - control
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - telemetry
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command:
      - -config.file=/etc/loki/loki.yml
    user: "0"
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - telemetry
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    networks:
      - telemetry
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    user: "0"
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - telemetry
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - telemetry
    restart: unless-stopped

networks:
  app:
  control:
  telemetry:

volumes:
  aiops-data:
  alertmanager-data:
  alloy-data:
  copilot-data:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
