global:
  resolve_timeout: 30s

route:
  receiver: capture
  group_by:
    - alertname
    - service
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: capture
    webhook_configs:
      - url: http://aiops-api:8081/api/v1/events/alertmanager
        send_resolved: true
