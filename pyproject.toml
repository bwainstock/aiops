[project]
name = "aiops-lab"
version = "0.1.0"
description = "Local, containerized AIOps learning system"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/aiops",
    "apps/alert_sink",
    "apps/demo_api",
    "apps/loadgen",
    "packages/ops_mcp",
    "packages/shared",
]

[tool.pyright]
include = ["apps", "packages", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
